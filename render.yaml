# Render Blueprint — deploy backend, frontend, and PostgreSQL together.
# Dashboard: New > Blueprint > connect this repo and apply this file.

databases:
  - name: iles-db
    plan: free
    databaseName: iles_g6_db
    user: iles_g6_user

services:
  - type: web
    name: iles-backend
    runtime: python
    plan: starter
    rootDir: ILES_G6_PROJECT
    buildCommand: bash build.sh
    startCommand: gunicorn ILES_G6_PROJECT.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: iles-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

  - type: static
    name: iles-frontend
    runtime: static
    plan: starter
    rootDir: iles_g6_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        sync: false
