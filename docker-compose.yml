version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ILES_G6_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./ILES_G6_PROJECT
    command: gunicorn ILES_G6_PROJECT.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ./:/code
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  frontend:
    build: ./iles_g6_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
